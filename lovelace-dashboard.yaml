# UZMZ Utility Meter Dashboard
# Paste into: Dashboard → Edit → Raw Configuration Editor
# Wrap under views: if adding to an existing dashboard

views:
  - title: Utility Meters
    path: utility-meters
    icon: mdi:gauge
    badges: []
    cards:
      # Header Card
      - type: markdown
        content: |
          # Utility Meter Monitor
          Real-time monitoring of your electric and water meters from USMS

      # Connection Status Warning (shows only when unavailable)
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.uzmz_electric_meter_electric_remaining_units
            state: unavailable
        card:
          type: markdown
          content: |
            ## ⚠️ Connection Issue
            UZMZ is unable to reach the USMS website. The integration will keep retrying automatically. Check **Notifications** for details.

      # Integration Status (shows when the integration last refreshed & when it will next try)
      - type: entities
        title: Integration Status
        entities:
          - entity: sensor.uzmz_integration_last_refresh
            name: Last Refresh
            icon: mdi:cloud-sync
          - entity: sensor.uzmz_integration_next_refresh
            name: Next Refresh
            icon: mdi:clock-outline

      # Electric Meter Section
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## Electric Meter

          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.uzmz_electric_meter_electric_remaining_units
                name: Remaining Units
                unit: kWh
                severity:
                  green: 100
                  yellow: 50
                  red: 0
                min: 0
                max: 500

              - type: entity
                entity: sensor.uzmz_electric_meter_electric_remaining_balance
                name: Balance
                icon: mdi:cash

          - type: entities
            entities:
              - entity: sensor.uzmz_electric_meter_electric_meter_status
                name: Status
                icon: mdi:information-outline
              - entity: sensor.uzmz_electric_meter_electric_last_updated
                name: Last Updated
                icon: mdi:update

      # Water Meter Section
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## Water Meter

          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.uzmz_water_meter_water_remaining_units
                name: Remaining Units
                unit: "m\xB3"
                severity:
                  green: 100
                  yellow: 50
                  red: 0
                min: 0
                max: 200

              - type: entity
                entity: sensor.uzmz_water_meter_water_remaining_balance
                name: Balance
                icon: mdi:cash

          - type: entities
            entities:
              - entity: sensor.uzmz_water_meter_water_meter_status
                name: Status
                icon: mdi:information-outline
              - entity: sensor.uzmz_water_meter_water_last_updated
                name: Last Updated
                icon: mdi:update

      # Historical Data
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## Historical Data

          - type: statistics-graph
            title: Electric Usage Trend
            entities:
              - sensor.uzmz_electric_meter_electric_remaining_units
            days_to_show: 365
            period: day
            stat_types:
              - mean
              - min
              - max

          - type: statistics-graph
            title: Electric Balance Trend
            entities:
              - sensor.uzmz_electric_meter_electric_remaining_balance
            days_to_show: 365
            period: day
            stat_types:
              - mean
              - min
              - max

          - type: statistics-graph
            title: Water Usage Trend
            entities:
              - sensor.uzmz_water_meter_water_remaining_units
            days_to_show: 365
            period: day
            stat_types:
              - mean
              - min
              - max

          - type: statistics-graph
            title: Water Balance Trend
            entities:
              - sensor.uzmz_water_meter_water_remaining_balance
            days_to_show: 365
            period: day
            stat_types:
              - mean
              - min
              - max

      # Manual Refresh Button
      - type: button
        tap_action:
          action: call-service
          service: homeassistant.update_entity
          service_data:
            entity_id:
              - sensor.uzmz_electric_meter_electric_remaining_units
              - sensor.uzmz_electric_meter_electric_remaining_balance
              - sensor.uzmz_electric_meter_electric_meter_status
              - sensor.uzmz_electric_meter_electric_last_updated
              - sensor.uzmz_water_meter_water_remaining_units
              - sensor.uzmz_water_meter_water_remaining_balance
              - sensor.uzmz_water_meter_water_meter_status
              - sensor.uzmz_water_meter_water_last_updated
        name: Refresh All Meters
        icon: mdi:refresh
        icon_height: 40px
