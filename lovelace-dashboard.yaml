# UZMZ Utility dashboard (sections view).
#
# Needs the helper sensors from examples/uzmz_package.yaml: consumption,
# days left, and the sign-in sensor.
#
# Install: Settings -> Dashboards -> Add dashboard. Open it, then
# Edit -> three dots -> Raw configuration editor, and paste this file.
#
# The "Signing in again soon" banner shows while UZMZ waits to sign in again
# by itself (automatic sign-in, UZMZ 1.7.1 or later with Remember password).
#
# The "USMS readings are late" banner shows when electricity has had no new
# usage for 6 hours or water for 3 days (needs UZMZ 1.6.0 or later).
#
# Gauge colours: electric goes red below 15 BND and yellow below 50; water
# goes red below 5 and yellow below 15. These match the USMS SMS alerts;
# adjust them to suit you.

views:
- type: sections
  title: Utility Meters
  path: utility-meters
  max_columns: 4
  cards: []
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:cloud-sync
      heading_style: title
    - type: markdown
      content: '## ⚠️ Sign-in required

        The USMS session ended, so readings have stopped. This happens when you sign in
        on the USMS website or app. [Open UZMZ](/config/integrations/integration/uzmz),
        choose **Reconfigure** and solve the captcha.'
      visibility:
      - condition: state
        entity: binary_sensor.uzmz_sign_in_required
        state: 'on'
    - type: markdown
      content: '## ⚠️ Can''t reach USMS

        The integration keeps retrying automatically. Check **Notifications** for details.'
      visibility:
      - condition: state
        entity: sensor.uzmz_electric_meter_electric_remaining_units
        state: unavailable
      - condition: state
        entity: binary_sensor.uzmz_sign_in_required
        state_not: 'on'
      - condition: state
        entity: binary_sensor.uzmz_signing_in_again
        state_not: 'on'
    - type: markdown
      content: '## 🔁 Signing in again soon

        {{ state_attr(''binary_sensor.uzmz_signing_in_again'', ''message'') }}'
      visibility:
      - condition: state
        entity: binary_sensor.uzmz_signing_in_again
        state: 'on'
    - type: markdown
      show_empty: false
      content: |-
        {%- set e = states('sensor.uzmz_electric_meter_electric_usage_updated') | as_datetime(none) -%}
        {%- set w = states('sensor.uzmz_water_meter_water_usage_updated') | as_datetime(none) -%}
        {%- set e_late = e is not none and now() - e > timedelta(hours=6) -%}
        {%- set w_late = w is not none and now() - w > timedelta(days=3) -%}
        {%- if e_late or w_late -%}
        ## ⏳ USMS readings are late
        {% if e_late %}Electricity: nothing new for {{ e | relative_time }}.
        {% endif %}{% if w_late %}Water: nothing new for {{ w | relative_time }}.
        {% endif %}Balances are estimates until USMS catches up.
        {%- endif -%}
    - type: entities
      entities:
      - entity: sensor.uzmz_integration_last_refresh
        name: Last Synced
        format: relative
      - entity: sensor.uzmz_integration_next_refresh
        name: Next Sync
        format: relative
      - type: button
        name: Sync now
        icon: mdi:refresh
        action_name: Sync
        tap_action:
          action: perform-action
          perform_action: homeassistant.update_entity
          target:
            entity_id: sensor.uzmz_electric_meter_electric_remaining_balance
  - type: grid
    cards:
    - type: heading
      heading: Electric
      icon: mdi:lightning-bolt
      heading_style: title
      badges:
      - type: entity
        entity: sensor.uzmz_electric_meter_electric_meter_status
        show_state: true
        show_icon: true
        color: red
        visibility:
        - condition: state
          entity: sensor.uzmz_electric_meter_electric_meter_status
          state_not: ACTIVE
    - type: gauge
      entity: sensor.uzmz_electric_meter_electric_remaining_balance
      name: Balance
      unit: BND
      min: 0
      max: 300
      severity:
        green: 50
        yellow: 15
        red: 0
      grid_options:
        columns: 12
        rows: auto
    - type: tile
      entity: sensor.uzmz_electric_meter_electric_remaining_units
      name: Remaining
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.uzmz_electric_days_left
      name: Days left (7-day avg)
      grid_options:
        columns: 6
    - type: entities
      entities:
      - entity: sensor.uzmz_electric_meter_electric_meter_status
        name: Status
      - entity: sensor.uzmz_electric_meter_electric_last_updated
        name: USMS reading date
        format: date
      - entity: sensor.uzmz_electric_meter_electric_usage_updated
        name: USMS last posted usage
        format: relative
  - type: grid
    cards:
    - type: heading
      heading: Water
      icon: mdi:water
      heading_style: title
      badges:
      - type: entity
        entity: sensor.uzmz_water_meter_water_meter_status
        show_state: true
        show_icon: true
        color: red
        visibility:
        - condition: state
          entity: sensor.uzmz_water_meter_water_meter_status
          state_not: ACTIVE
    - type: gauge
      entity: sensor.uzmz_water_meter_water_remaining_balance
      name: Balance
      unit: BND
      min: 0
      max: 60
      severity:
        green: 15
        yellow: 5
        red: 0
      grid_options:
        columns: 12
        rows: auto
    - type: tile
      entity: sensor.uzmz_water_meter_water_remaining_units
      name: Remaining
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.uzmz_water_days_left
      name: Days left (7-day avg)
      grid_options:
        columns: 6
    - type: entities
      entities:
      - entity: sensor.uzmz_water_meter_water_meter_status
        name: Status
      - entity: sensor.uzmz_water_meter_water_last_updated
        name: USMS reading date
        format: date
      - entity: sensor.uzmz_water_meter_water_usage_updated
        name: USMS last posted usage
        format: relative
  - type: grid
    cards:
    - type: heading
      heading: Usage
      icon: mdi:chart-bar
      heading_style: title
    - type: statistics-graph
      title: Electricity used per day
      entities:
      - entity: sensor.uzmz_electric_consumption
        name: Electric
      chart_type: bar
      period: day
      stat_types:
      - change
      days_to_show: 30
      hide_legend: true
    - type: statistics-graph
      title: Water used per day
      entities:
      - entity: sensor.uzmz_water_consumption
        name: Water
      chart_type: bar
      period: day
      stat_types:
      - change
      days_to_show: 30
      hide_legend: true
    - type: statistics-graph
      title: Electric balance (30 days)
      chart_type: line
      period: day
      stat_types:
      - mean
      days_to_show: 30
      entities:
      - entity: sensor.uzmz_electric_meter_electric_remaining_balance
        name: Electric
      hide_legend: true
    - type: statistics-graph
      title: Water balance (30 days)
      chart_type: line
      period: day
      stat_types:
      - mean
      days_to_show: 30
      entities:
      - entity: sensor.uzmz_water_meter_water_remaining_balance
        name: Water
      hide_legend: true
  icon: mdi:gauge
